<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AN KHANG HOME - Premium Native-Font Utility Analytics & Reconciliation Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            // Flawless modern native system-ui stack - 100% bug-free for Vietnamese diacritics offline/online
            sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
            outfit: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          colors: {
            primary: '#059669', // Strong emerald green brand color for high readability
            'primary-dark': '#047857',
            brandTeal: '#08332f', // Teal-slate matching AN KHANG HOME header
            bgLight: '#f5f6f8',
          }
        }
      }
    }
  </script>
  <style>
    /* Absolute reset to forced system-ui for bulletproof Vietnamese rendering */
    * {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
    }
    
    body {
      background-color: #f5f6f8;
      scroll-behavior: smooth;
    }
    
    /* Custom Scrollbar for Room List */
    ::-webkit-scrollbar {
      width: 6px;
    }
  </div>

  <!-- Room Detailed Modal -->
  <div id="roomModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity duration-300 opacity-0">
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-350 w-full max-w-lg overflow-hidden flex flex-col transform translate-y-8 transition-transform duration-300">
      <div class="px-6 py-4.5 border-b border-slate-200 bg-slate-100 flex items-center justify-between">
        <div>
          <h3 class="text-base font-black font-outfit text-slate-950 flex items-center gap-2">
            <i class="fa-solid fa-house-user text-emerald-600"></i> Chi Tiết Sử Dụng - Phòng <span id="roomModalNo">102</span>
          </h3>
          <p class="text-xs text-slate-700 mt-0.5 font-bold">Báo cáo chỉ số điện nước cá nhân của khách trọ</p>
        </div>
        <button onclick="closeRoomModal()" class="h-9 w-9 rounded-full bg-slate-200 hover:bg-slate-300 flex items-center justify-center text-slate-655 hover:text-slate-900 transition border border-slate-300">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
