appId: com.kmaphouse.app
productName: DBY HOME
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/**/*'
  - '!supabase/**/*'
  - '!scripts/**/*'
  - '!dist/**/*'
  - '!build/**/*'
  - '!_perf-package-check*/**/*'
  - '!.claude/**/*'
  - '!.planning/**/*'
  - '!_tmp_min_pkg/**/*'
  - '!.update-check-latest/**/*'
  - '!LOGO/**/*'
  - '!RAG/**/*'
  - '!phase/**/*'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.{ts,tsx,mts,cts,tsbuildinfo}'
  - '!node_modules/**/{test,tests,__tests__,docs,example,examples}/**/*'
  - '!node_modules/**/*.snap'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!electron.vite.config.*.mjs'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,app.code-workspace}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.web.tsbuildinfo}'
  - '!*.{bat,sql,code-workspace}'
  - '!{_tmp_min_app.js,debug_json.js,demo_doi_soat.html,download_vehicles.js,extract_from_view_file.js,find_creation.js,find_full_backup.js,find_lines.js,getfont.js,restore_html.js,]}'
asar: false
asarUnpack:
  - resources/**
extraFiles:
  - from: node_modules/electron/dist/resources.pak
    to: .
  - from: node_modules/electron/dist/v8_context_snapshot.bin
    to: .
  - from: node_modules/electron/dist/libGLESv2.dll
    to: .
  - from: node_modules/electron/dist/d3dcompiler_47.dll
    to: .
  - from: node_modules/electron/dist/chrome_200_percent.pak
    to: .
  - from: node_modules/electron/dist/vk_swiftshader.dll
    to: .
  - from: node_modules/electron/dist/version
    to: .
win:
  executableName: DBY Home
  icon: build/icon.ico
  signAndEditExecutable: true
nsis:
  artifactName: DBYHOME-${version}-setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: DBY HOME
  uninstallDisplayName: DBY HOME
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://github.com/yendao444-del/k-map-house/releases/latest/download/
